<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Projects - Silas Unger</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="My personal projects I have created and built over the past few years." />
        <meta name="theme-color" content="#000000">
        <link rel="icon" href="/images/favicon.ico">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Jersey+10&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/style.css">

        <style>

            .project h3 {
                font-size: 20px;
                color: #896583;
            }

            .democontainer {
                width: 100%;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            .demotextcont {
                display: flex;
                flex-direction: row;
                gap: 25px;
            }

            .img-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
            }

            .img-container img {
                width: 100%;
                height: 210px;
                object-fit: cover;
                image-rendering: auto;
            }
        </style>
    </head>
    <body>
        <div class="parallax-bg"></div>

        <div id="popup" class="popup">
            <span class="close">&times;</span>

            <span class="arrow left"><</span>
            <img id="popup-img">
            <span class="arrow right">></span>

            <div id="popup-caption" class="caption">cat</div>
        </div>

        <div class="team top container">
            <a href="/">
                <img src="/images/home.png" width="200px">
            </a>
        </div>


        <div class="container outline header">
            <img src="/images/arcade.png">
        </div>

        <h2 class="blink center">. • * • .</h2>

        <div id="projects"></div>
        

        <div class="container outline footer">
            <img src="/images/banners/256_monitor_button.gif">
            <img src="/images/banners/acab.gif">
            <img src="/images/banners/adobe_photo.gif">
            <img src="/images/banners/nodrugs.gif">
            <img src="/images/banners/50041.gif">
            <img src="/images/banners/hackclub.png">
        </div>

        <p class="center copywrite">© 2026 Silas Unger</p>
        <script src="/parallax.js"></script>
        <script src="/lightbox.js"></script>
        <script src="projects.js"></script>
    </body>
</html>
